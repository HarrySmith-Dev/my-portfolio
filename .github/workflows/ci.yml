name: 'CI Workflow'

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build 🚀'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 'Checkout 📦'
        uses: actions/checkout@v4

      - name: 'Setup Node 🟢'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: 'Install dependencies 📚'
        run: yarn install --frozen-lockfile

      - name: 'Lint 🔍'
        run: yarn lint

      - name: 'Build 🧱'
        run: yarn -s build

      - name: 'Status message ✅'
        run: echo "✅ All CI checks passed"
